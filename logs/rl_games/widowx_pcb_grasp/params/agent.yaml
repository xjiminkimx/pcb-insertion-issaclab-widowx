params:
  seed: 42
  algo:
    name: a2c_continuous
  model:
    name: continuous_a2c_logstd
  network:
    name: actor_critic
    separate: false
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -0.3
        fixed_sigma: false
    mlp:
      units:
      - 256
      - 128
      - 64
      activation: elu
      initializer:
        name: default
  load_checkpoint: false
  env:
    name: rlgpu
    env_name: rlgpu
    clip_observations: 10.0
    clip_actions: 0.35
  config:
    name: widowx_pcb_grasp
    full_experiment_name: .
    env_name: rlgpu
    device: cuda:0
    ppo: true
    mixed_precision: false
    weight_decay: 1.0e-05
    normalize_input: true
    normalize_value: true
    value_bootstrap: true
    use_diagnostics: true
    normalize_advantage: true
    num_actors: 4096
    reward_shaper:
      scale_value: 1.0
    gamma: 0.99
    tau: 0.95
    learning_rate: 0.0005
    lr_schedule: adaptive
    kl_threshold: 0.012
    score_to_win: 20000
    max_epochs: 250
    save_best_after: 30
    save_frequency: 15
    print_stats: true
    grad_norm: 0.5
    entropy_coef: 0.02
    truncate_grads: true
    e_clip: 0.3
    horizon_length: 128
    minibatch_size: 8192
    mini_epochs: 8
    critic_coef: 2
    clip_value: true
    seq_len: 4
    bounds_loss_coef: 0.0001
    train_dir: /home/jimin/Documents/IsaacLab/source/isaaclab_tasks/isaaclab_tasks/manager_based/widowx_pcb/logs/rl_games/widowx_pcb_grasp
